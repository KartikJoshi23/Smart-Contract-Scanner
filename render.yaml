# Render Blueprint — one-click deploy
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: smart-contract-scanner-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --workers 1 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: ALCHEMY_API_KEY
        sync: false
      - key: DATABASE_URL
        value: sqlite:///./contract_scanner.db
